<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descargar - Edificio Uruguay Balance</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #1B2A4A 0%, #2D4A7A 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: white;
  border-radius: 16px;
  padding: 40px;
  max-width: 500px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
h1 { color: #1B2A4A; font-size: 24px; margin-bottom: 8px; }
p { color: #666; font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
.btn {
  display: inline-block;
  background: linear-gradient(135deg, #1B7D46, #219653);
  color: white;
  padding: 16px 40px;
  border-radius: 12px;
  text-decoration: none;
  font-size: 18px;
  font-weight: 600;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 15px rgba(27,125,70,0.4);
  cursor: pointer;
  border: none;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(27,125,70,0.5); }
.steps {
  text-align: left;
  margin-top: 24px;
  padding: 16px;
  background: #f7f7f5;
  border-radius: 8px;
  font-size: 13px;
  color: #555;
  line-height: 1.8;
}
.steps strong { color: #1B2A4A; }
</style>
</head>
<body>
<div class="card">
  <h1>Edificio Uruguay</h1>
  <p>Balance de Ingresos y Gastos<br>27 apartamentos + 2 locales</p>
  <button class="btn" onclick="downloadFile()">Descargar Excel</button>
  <div class="steps">
    <strong>Como subir a Google Sheets:</strong><br>
    1. Hace clic en "Descargar Excel"<br>
    2. Abri <strong>drive.google.com</strong><br>
    3. Arrastra el archivo descargado a Drive<br>
    4. Doble clic -> "Abrir con Google Sheets"
  </div>
</div>
<script>
function downloadFile(){
  fetch('Edificio_Uruguay_Balance.xlsx')
    .then(r=>r.blob())
    .then(blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download='Edificio_Uruguay_Balance.xlsx';
      document.body.appendChild(a);a.click();
      document.body.removeChild(a);URL.revokeObjectURL(url);
    });
}
</script>
</body>
</html>
